<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#080B14" stroke="rgba(0,212,255,0.3)" stroke-width="2" />
  <text x="12" y="42" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="900" fill="url(#mvGrad)" filter="url(#glow)">MV</text>
  <circle cx="50" cy="40" r="4" fill="#00D4FF" />
</svg>
